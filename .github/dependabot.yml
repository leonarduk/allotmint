# Dependabot version updates for the dependency ecosystems used by AllotMint.
#
# Dependency Review still protects pull requests that modify manifests; this file
# adds proactive scheduled update PRs. To extend coverage, add another entry under
# `updates` with a supported `package-ecosystem`, the manifest `directory` (or a
# `directories` list), and a `schedule` block.
version: 2
updates:
  # GitHub Actions: scans workflows under .github/workflows from the repo root.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # Root npm workspace: package.json and package-lock.json in the repo root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # Frontend npm workspace: React/Vite app dependencies in frontend/.
  # Patch-level bumps of direct dev dependencies from this entry are
  # auto-merged by .github/workflows/dependabot-auto-merge.yml once required
  # status checks pass; production deps and minor/major bumps still need a
  # manual review. See issue #5540.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # Root and backend Python dependencies: requirements.txt plus
  # requirements-dev.txt in the repo root, and backend/requirements*.txt.
  # One entry for both directories, so a dependency pinned in both is bumped in
  # both by the same PR; tests/test_requirements_consistency.py fails when a
  # ~= pin differs between the two sides (#11386). Separate entries opened one
  # PR per directory and let the root pins fall behind (#11377).
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      # boto3 and botocore are released in lockstep; one PR bumps both. Listed
      # first because a dependency joins the first group it matches.
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
      # Every other dependency: one PR per dependency, updating it in every
      # directory above that uses it.
      python-deps:
        group-by: dependency-name

  # CDK Python dependencies: infrastructure requirements in cdk/.
  - package-ecosystem: "pip"
    directory: "/cdk"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
