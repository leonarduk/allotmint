[project]
requires-python = ">=3.11"
dependencies = [
    "reportlab>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "pytest-asyncio~=1.4.0",
]
# Private paid engine: screener, VaR/risk, compliance rule engine, allowances,
# anomaly repair. Requires SSH or token access to the private repo. Without
# this extra installed, the corresponding routes return 402 (see
# backend/common/core_optional.py).
core = [
    "allotmint-core @ git+https://github.com/leonarduk/allotmint-core.git",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
