name: Build Android TWA

# Builds the signed Play Store bundle for the Trusted Web Activity in
# mobile/twa (#11036). Manual only: upload the .aab artifact to Play Console.
# Setup (keystore, secrets, Play Console, asset links): docs/ANDROID_PLAY_STORE.md
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'User-visible version name (e.g. 1.2.0). The versionCode is derived from the run number and attempt.'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: android-twa
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Play Store bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_PATH: mobile/twa/app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v7

      - name: Check signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_UPLOAD_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see docs/ANDROID_PLAY_STORE.md)"
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed bundle
        working-directory: mobile/twa
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          TWA_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          TWA_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS || 'upload' }}
          TWA_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          # Play rejects any upload whose versionCode is not higher than the
          # last one. A re-run keeps its run number, so fold in the attempt:
          # run N attempt A -> N*100+A, which increases across runs and re-runs
          # (assuming fewer than 100 attempts per run).
          TWA_VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          export TWA_VERSION_CODE
          echo "TWA_VERSION_CODE=$TWA_VERSION_CODE" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          TWA_KEYSTORE_PATH="$KEYSTORE_PATH" ./gradlew --no-daemon bundleRelease

      - name: Verify bundle is signed
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS || 'upload' }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          # jarsigner exits 0 for an unsigned jar too, so check its verdict text
          # (exactly "jar verified."; warnings about a self-signed upload key
          # follow on later lines and are expected).
          if ! "$JAVA_HOME_21_X64/bin/jarsigner" -verify "$BUNDLE_PATH" | grep -qx 'jar verified\.'; then
            echo "::error::$BUNDLE_PATH is not signed"
            exit 1
          fi
          fingerprint=$("$JAVA_HOME_21_X64/bin/keytool" -list -v -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sed -n 's/^\s*SHA256: //p')
          {
            echo "### Android TWA bundle"
            echo "- versionCode: \`${TWA_VERSION_CODE}\`, versionName: \`${VERSION_NAME}\`"
            echo "- Upload certificate SHA-256 (public; add to the ANDROID_TWA_CERT_FINGERPRINTS variable): \`${fingerprint}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: allotmint-twa-${{ inputs.version_name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.BUNDLE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
