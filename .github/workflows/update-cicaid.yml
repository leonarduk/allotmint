name: Update cicaid

on:
  schedule:
    # Daily at 06:00 UTC. NOTE: GitHub disables scheduled workflows in a
    # repository with no activity for 60 days, and does not re-enable them
    # automatically -- a dormant repo silently stops updating until someone
    # re-enables this workflow (or runs it via workflow_dispatch).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # gh issue create, for the linked tracking issue

# One scheduled run at a time; a manual run must not cancel a scheduled one.
concurrency:
  group: cicaid-pin-update
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.dependency }}
    runs-on: ubuntu-latest
    strategy:
      # Independent legs: a failure updating one dependency (e.g. the
      # private cicaid-pro releases lookup) must not cancel the other.
      fail-fast: false
      matrix:
        dependency: [cicaid-devtools, cicaid-devtools-pro]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for update
        id: check
        env:
          # leonarduk/cicaid-pro is private, so its releases API 404s
          # unauthenticated; the script only sends this for that leg.
          GITHUB_TOKEN: ${{ secrets.CICAID_PRO_TOKEN }}
        run: |
          OUTPUT=$(python .github/scripts/update_cicaid_pins.py "${{ matrix.dependency }}" --check)
          echo "$OUTPUT"
          if [[ "$OUTPUT" == UP-TO-DATE* ]]; then
            echo "Already up to date; nothing to do."
            exit 0
          fi
          # Fail loudly if the helper's output format ever changes, rather
          # than parsing garbage into a branch name and a commit message.
          # These values are interpolated into shell commands below, so a
          # version carrying a metacharacter must stop the run.
          CHECK_RE='^UPDATE [a-z0-9-]+ [A-Za-z0-9._+-]+ -> [A-Za-z0-9._+-]+$'
          if ! [[ "$OUTPUT" =~ $CHECK_RE ]]; then
            echo "Unexpected output from update_cicaid_pins.py: $OUTPUT" >&2
            exit 1
          fi
          OLD_VERSION=$(awk '{print $3}' <<<"$OUTPUT")
          NEW_VERSION=$(awk '{print $5}' <<<"$OUTPUT")
          # PEP 440 local versions (1.2.3+abc123) are legal in a branch name,
          # but `gh` URL-encodes the "+" and it reads as a space in the PR UI.
          # Only the branch name gets the substitution; the commit message,
          # PR title and issue title all keep the true version.
          BRANCH_VERSION=${NEW_VERSION//+/-}
          if [[ "${{ matrix.dependency }}" == "cicaid-devtools" ]]; then
            RELEASE_URL="https://github.com/leonarduk/cicaid/releases/tag/v${NEW_VERSION}"
          else
            RELEASE_URL="https://github.com/leonarduk/cicaid-pro/releases/tag/v${NEW_VERSION}"
          fi
          # One redirect for the group rather than four: a repo whose own
          # lint runs actionlint with shellcheck enabled (rather than the
          # `-shellcheck=` the generated workflow-lint.yml uses) fails the
          # job on SC2129 otherwise.
          {
            echo "old_version=$OLD_VERSION"
            echo "new_version=$NEW_VERSION"
            echo "branch_version=$BRANCH_VERSION"
            echo "release_url=$RELEASE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if a PR for this update already exists
        id: skip
        if: steps.check.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="deps/${{ matrix.dependency }}-v${{ steps.check.outputs.branch_version }}"
          PR_COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq 'length')
          if [[ "$PR_COUNT" != "0" ]]; then
            echo "Skipping: a PR for $BRANCH is already open."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open PR for $BRANCH; proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pin on a dependency branch
        if: steps.check.outputs.new_version != '' && steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "deps/${{ matrix.dependency }}-v${{ steps.check.outputs.branch_version }}"
          python .github/scripts/update_cicaid_pins.py "${{ matrix.dependency }}"
          git diff --stat

      # A PR opened with the default GITHUB_TOKEN does not trigger this
      # repo's other workflows, so the AI review will not run on it. This
      # install is therefore the only signal, before a human looks, that the
      # bumped pin actually resolves and installs.
      - name: Install dependencies from the updated pin
        if: steps.check.outputs.new_version != '' && steps.skip.outputs.skip != 'true'
        env:
          CICAID_PRO_TOKEN: ${{ secrets.CICAID_PRO_TOKEN }}
        run: |
          set -euo pipefail
          PINS=".github/cicaid-pins.env"
          CICAID_REF=$(grep -oP '^CICAID_REF=\K(?:main|v[0-9][A-Za-z0-9.+-]*)(?=\r?$)' "$PINS")
          CICAID_PRO_REF=$(grep -oP '^CICAID_PRO_REF=\K(?:main|v[0-9][A-Za-z0-9.+-]*)(?=\r?$)' "$PINS")
          bash .github/scripts/pip_install_cicaid_pro.sh pip install --retries 10 \
            "cicaid-devtools @ git+https://github.com/leonarduk/cicaid.git@${CICAID_REF}" \
            "cicaid-devtools-pro @ git+https://github.com/leonarduk/cicaid-pro.git@${CICAID_PRO_REF}"

      - name: Create or reuse a linked issue for the update
        id: issue
        if: steps.check.outputs.new_version != '' && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Update ${{ matrix.dependency }} to v${{ steps.check.outputs.new_version }}"
          # Reuse an open issue with this exact title so a retried run links
          # to the same issue instead of stacking duplicates.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            echo "Reusing issue #$EXISTING for this update."
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(cat <<EOF
          Update \`${{ matrix.dependency }}\` from ${{ steps.check.outputs.old_version }} to ${{ steps.check.outputs.new_version }}.

          - Release notes: ${{ steps.check.outputs.release_url }}
          - Opened by the update-cicaid workflow; the dependency PR links back
            to this issue and closes it on merge.
          EOF
          )
          ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY")
          ISSUE_NUMBER=${ISSUE_URL##*/}
          echo "Created issue #$ISSUE_NUMBER."
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Push and open pull request
        if: steps.check.outputs.new_version != '' && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="deps/${{ matrix.dependency }}-v${{ steps.check.outputs.branch_version }}"
          git add .github/cicaid-pins.env
          git commit -m "Update ${{ matrix.dependency }} to v${{ steps.check.outputs.new_version }}"
          # The skip step guarantees no open PR exists for this branch, so a
          # surviving remote branch is a leftover from a run that failed
          # after pushing. Replace it rather than colliding on a
          # non-fast-forward push.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Deleting stale branch $BRANCH from a previous failed run."
            git push origin --delete "$BRANCH"
          fi
          git push -u origin "$BRANCH"
          BODY=$(cat <<EOF
          Update \`${{ matrix.dependency }}\` from ${{ steps.check.outputs.old_version }} to ${{ steps.check.outputs.new_version }}.

          - Release notes: ${{ steps.check.outputs.release_url }}
          - The updated pin installed cleanly in this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Closes #${{ steps.issue.outputs.issue_number }}
          EOF
          )
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "Update ${{ matrix.dependency }} to v${{ steps.check.outputs.new_version }}" \
            --body "$BODY"
