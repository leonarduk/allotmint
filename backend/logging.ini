[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=consoleHandler,fileHandler,telegramHandler,jsonConsoleHandler

[formatters]
keys=standard,json

[filters]
keys=redactToken

[filter_redactToken]
()=backend.utils.telegram_utils.RedactTokenFilter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler

[logger_uvicorn]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler
qualname=uvicorn
propagate=0

[logger_uvicorn.error]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler
qualname=uvicorn.access
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standard
filters=redactToken
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=standard
filters=redactToken
args=('backend.log','a')

[handler_telegramHandler]
class=backend.utils.telegram_utils.TelegramLogHandler
level=WARNING
formatter=standard
filters=redactToken
args=()

[handler_jsonConsoleHandler]
class=StreamHandler
level=INFO
formatter=json
filters=redactToken
args=(sys.stdout,)

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_json]
class=backend.logging_setup.JSONFormatter
# `format` only tells python-json-logger which LogRecord attributes to pull
# into message_dict; it does not control the emitted key order or set. The
# actual output fields (timestamp, level, logger, message) are fixed by
# JSONFormatter.add_fields() in backend/logging_setup.py, which overrides
# whatever this string selects. Kept for python-json-logger's benefit, not
# because changing it changes the output.
format=%(levelname)s %(name)s %(message)s
