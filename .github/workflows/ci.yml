name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  # Single source of truth for which areas a PR can affect. Always runs (never
  # gated itself) so jobs that `needs: classify-change` never lose their
  # required status check to skip-propagation.
  #
  # Gated jobs below use `<area> != 'false'` rather than `== 'true'`: if the
  # classifier fails its outputs are empty strings, and `!= 'false'` is the
  # polarity that then errs towards running the suite. Pair it with
  # `!cancelled()` (not the implicit default success()) so a classify-change
  # failure doesn't skip-propagate. See scripts/classify_change.py.
  classify-change:
    uses: ./.github/workflows/_classify-change.yml

  # Repo-hygiene checks: cheap, apply to every PR, and gate nothing
  # area-specific. Deliberately ungated --
  # check_branch_protection_required_checks.py is what stops the ruleset
  # drifting away from the jobs below, so it must run even on a change that
  # affects no test area.
  #
  # Do NOT add a `name:` here and do not rename the job id. GitHub matches a
  # required status check against the *check-run name*, which for a job without
  # a `name:` is the bare job id -- so this job's context is literally "test"
  # in .github/rulesets/default-branch-protection.json, not "CI / test".
  # Renaming it (or adding a `name:`) would leave branch protection waiting
  # forever for a context no workflow produces. See issue #5728.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --retries 10 -r requirements.txt -r requirements-dev.txt
      - run: python scripts/check_branch_protection_required_checks.py
      # Fork and Dependabot pull requests cannot read repository secrets. Keep
      # this private automation dependency out of requirements-dev.txt so the
      # required `test` check still exercises all public checks in those
      # contexts instead of failing during dependency installation.
      - name: Install private review automation when credentials are available
        id: automation-deps
        env:
          CICAID_PRO_TOKEN: ${{ secrets.CICAID_PRO_TOKEN }}
        run: |
          if [ -z "$CICAID_PRO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping private cicaid automation tests because CICAID_PRO_TOKEN is unavailable."
            exit 0
          fi
          bash .github/scripts/pip_install_cicaid_pro.sh \
            pip install --retries 10 -r requirements-automation.txt
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Run review_common and review-script tests
        if: steps.automation-deps.outputs.available == 'true'
        run: pytest tests/test_review_common.py tests/test_ai_review_scripts.py -v --no-cov
      - name: Check package-lock.json cross-OS platform coverage
        run: python scripts/check_lockfile_platform_coverage.py
      - name: Audit architecture diagram reproducibility and references
        run: python scripts/check_architecture_diagrams.py

  frontend-checks:
    name: Frontend lint, type-check and unit tests
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.frontend != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # tsc -b resolves frontend/tsconfig.json, which references
      # tsconfig.app.json (src/) and tsconfig.node.json (vite.config.ts).
      # Both are checked in one pass; no Vite build required.
      - name: TypeScript type-check (tsc -b)
        run: npm run type-check
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend

  cdk-tests:
    name: CDK infrastructure tests
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.cdk != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --retries 10 -r requirements.txt -r requirements-dev.txt
      - name: Check cdk/tests/ exists and has tests
        run: |
          if [ ! -d "cdk/tests" ] || [ -z "$(ls -A cdk/tests/)" ]; then
            echo "ERROR: cdk/tests/ is missing or empty. This job requires at least one test file in cdk/tests/."
            exit 1
          fi
      - name: CDK infrastructure tests
        run: pytest cdk/tests/ --no-cov

  shell-tests:
    name: Bash script tests (bats)
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.shell != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # bats-core is fetched on demand via npx rather than assuming it's
      # preinstalled on the runner image; pin the version so an upstream
      # bats-core release can't silently change CI behaviour. All aws CLI
      # calls in these tests are mocked (see
      # tests/bash/fetch-cloudwatch-logs.bats), so this is a pure dry-run
      # with no live AWS network access.
      - name: Run bats tests for deploy shell scripts
        run: npx --yes bats@1.13.0 tests/bash/*.bats

  # Not redundant with lambda-compat below. This job checks both dependency
  # entry points: backend/requirements.txt gets a fast resolution/duplicate
  # check, while root requirements.txt gets a real install in a separate clean
  # venv followed by an application import. The latter catches missing root
  # dependencies that a pre-populated GitHub runner could otherwise mask.
  # lambda-compat does a full install plus the entire pytest suite against the
  # Lambda-specific dependency set. Keep both (issues #4467 and #6018).
  validate-backend-deps:
    name: Validate backend/requirements.txt (dry-run)
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.backend != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Assert no duplicate package names in backend/requirements.txt
        run: |
          python - << 'PY'
          import re, sys
          from pathlib import Path
          lines = Path("backend/requirements.txt").read_text(encoding="utf-8").splitlines()
          # Skip blank lines, comments (#), and any pip option line (-r, -c,
          # -e, --index-url, etc.).  All pip options start with "-", so a
          # single startswith check covers them regardless of spacing.
          # Normalise per PEP 503: treat "-", "_", "." as equivalent so
          # "typing_extensions" and "typing-extensions" are the same package.
          pkgs = [
              re.sub(r"[-_.]+", "-",
                     re.sub(r"\[.*?\]", "",
                            re.split(r"[~>=<!;\s#]", line)[0].strip())).lower()
              for line in lines
              if line.strip() and not line.strip().startswith(("#", "-"))
          ]
          seen: set[str] = set()
          dups: list[str] = []
          for pkg in pkgs:
              if pkg in seen:
                  dups.append(pkg)
              else:
                  seen.add(pkg)
          if dups:
              print(f"Duplicate package names in backend/requirements.txt: {dups}", file=sys.stderr)
              sys.exit(1)
          print(f"No duplicate package names ({len(pkgs)} packages checked).")
          PY
      # Use a clean venv so runner pre-installs cannot mask genuine conflicts.
      # Upgrade pip first: --dry-run was added in pip 23.1 and is silently
      # ignored on older versions, which would let a broken file pass.
      - name: Dry-run install to catch dependency conflicts before they reach Docker
        run: |
          python -m venv .venv-lambda-check
          .venv-lambda-check/bin/pip install --upgrade pip
          .venv-lambda-check/bin/pip --version
          if ! .venv-lambda-check/bin/pip install --dry-run -r backend/requirements.txt; then
            echo "::error file=backend/requirements.txt::Dependency conflict detected — Docker build will fail. Check pip output above for the conflicting packages."
            exit 1
          fi
      - name: Verify root requirements can start the backend in a fresh venv
        env:
          ALLOTMINT_SKIP_SNAPSHOT_WARM: 'true'
        run: |
          python -m venv .venv-root-startup
          .venv-root-startup/bin/pip install --upgrade pip
          .venv-root-startup/bin/pip install -r requirements.txt
          .venv-root-startup/bin/python -c 'from backend.local_api.main import app; assert app is not None'

  backend-lint:
    # Scoped to this change's files, not the whole tree: the backend/tests
    # baseline currently has ~200 pre-existing Ruff findings and ~235 files
    # Black would reformat (see PR #6261 review), so linting everything on
    # every PR would fail on code the PR never touched. New/edited files are
    # held to backend/pyproject.toml; untouched pre-existing violations are
    # not, until a separate cleanup PR fixes the baseline and this job can
    # lint `backend tests` unscoped again.
    name: Backend lint (ruff, black)
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.backend != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: pull_request mode diffs base...head to find this
          # PR's changed files, and a shallow clone has no merge base.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend and development dependencies
        run: pip install --retries 10 -r requirements.txt -r requirements-dev.txt
      - name: Lint backend/tests Python files touched by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" -- backend tests | grep '\.py$' || true)
          else
            # Non-PR event (push to main): no base to diff against, so lint
            # the whole tree rather than silently skip.
            FILES=$(git ls-files backend tests | grep '\.py$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "No backend/tests Python files to lint."
            exit 0
          fi
          echo "$FILES"
          echo "$FILES" | xargs -d '\n' ruff check --config backend/pyproject.toml
          echo "$FILES" | xargs -d '\n' black --check --config backend/pyproject.toml

  lambda-compat:
    name: Lambda-compat pytest (backend/requirements.txt)
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.backend != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create isolated venv for Lambda-compat test
        # Use an explicit venv so that runner pre-installs cannot mask missing
        # pins, matching the isolation pattern used by validate-backend-deps.
        run: python -m venv .venv-lambda
      - name: Install Lambda-compatible deps + test tooling
        run: |
          .venv-lambda/bin/pip install --upgrade pip
          .venv-lambda/bin/pip install --retries 10 -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run backend pytest suite against Lambda deps
        env:
          ALLOTMINT_SKIP_SNAPSHOT_WARM: 'true'
        # Run tests/ under Lambda-pinned deps to validate the backend works in
        # the constrained Lambda runtime environment. The cdk-tests job runs
        # cdk/tests/ instead, covering CDK infrastructure. This avoids
        # duplication: tests/ runs once (here), cdk/tests/ runs once (in
        # cdk-tests), against their respective dependency sets.
        # The cicaid-specific modules have their own credential-aware step in
        # the required `test` job; the Lambda suite must remain runnable for
        # fork PRs that cannot access the private automation dependency.
        # tests/scripts/test_n_review_issue.py also transitively imports
        # cicaid_devtools (via scripts/developer_tools/n_review_issue.py) and
        # is excluded for the same reason.
        run: >-
          .venv-lambda/bin/pytest tests/
          --ignore=tests/test_review_common.py
          --ignore=tests/test_ai_review_scripts.py
          --ignore=tests/scripts/test_n_review_issue.py

  lint-shell-scripts:
    name: Lint .github/scripts shell scripts (shellcheck)
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.shell != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships shellcheck preinstalled; non-blocking (continue-on-error)
      # until the existing scripts are cleaned up and this can be made required.
      - name: Run shellcheck
        continue-on-error: true
        run: shellcheck .github/scripts/*.sh

  # Deliberately ungated: this is the check that validates the gating itself,
  # so it must run on every PR, including ones that touch only workflow YAML.
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL --retry 5 --retry-delay 5 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm actionlint.tar.gz
      - name: Run actionlint (includes shellcheck on inline scripts)
        run: actionlint

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility smoke
    needs: classify-change
    if: "!cancelled() && needs.classify-change.outputs.backend != 'false'"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v7
      # Python 3.12 remains covered by the primary CI/backend integration job;
      # this lightweight smoke keeps Python 3.11 support honest without
      # duplicating the full backend integration and coverage workflow.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install --retries 10 -r requirements.txt -r requirements-dev.txt
      - name: Check SPA contract version sync
        run: python scripts/check_contract_version_sync.py
      - name: Run lightweight backend compatibility tests
        env:
          ALLOTMINT_SKIP_SNAPSHOT_WARM: 'true'
        run: pytest --no-cov tests/test_backend_api.py::test_health tests/backend/common/test_data_provider_parity.py -q

  frontend-smoke:
    name: Frontend smoke tests (preview build)
    needs: [classify-change, frontend-checks]
    # Three clauses, each load-bearing:
    #   !cancelled()                     -- survive a classify-change failure
    #                                       instead of skip-propagating, which
    #                                       would report this required check as
    #                                       skipped (i.e. passing) without ever
    #                                       running the smoke tests.
    #   frontend-checks.result != failure -- don't spend ~15 min on Playwright
    #                                       when lint/type-check/vitest already
    #                                       failed. `!cancelled()` replaces the
    #                                       implicit success(), so this has to
    #                                       be stated explicitly. A *skipped*
    #                                       frontend-checks is fine: it means
    #                                       frontend == 'false', and the third
    #                                       clause skips this job too.
    #   frontend != 'false'              -- the actual area gate, in fail-safe
    #                                       polarity (empty output => run).
    if: >-
      !cancelled()
      && needs.frontend-checks.result != 'failure'
      && needs.classify-change.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend-deps
      - name: Build preview
        run: npm run build:preview
        working-directory: frontend
      - name: Verify base href is relative in built index.html
        run: |
          set -euo pipefail
          if grep -q '<base href="http' frontend/dist/index.html; then
            echo "::error file=frontend/index.html::Built index.html contains an absolute <base href=\"http...\"> which breaks routing in deployed environments (the base URL must be relative, e.g. <base href=\"/\">). Check that index.html's <base href> is hardcoded to a relative path and not dynamically set."
            exit 1
          fi
          echo "✓ base href is relative (no absolute http:// or https:// base found)"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run frontend smoke tests
        run: npx playwright test --config playwright.config.ts tests/smoke.spec.ts tests/navActiveState.spec.ts
        working-directory: frontend
      - name: Upload Playwright smoke-test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-frontend-smoke-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
