[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=consoleHandler,fileHandler,telegramHandler,jsonConsoleHandler

[formatters]
keys=standard,json

[filters]
keys=redactToken

[filter_redactToken]
()=backend.utils.telegram_utils.RedactTokenFilter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler

[logger_uvicorn]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler
qualname=uvicorn
propagate=0

[logger_uvicorn.error]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=INFO
handlers=consoleHandler,fileHandler,telegramHandler
qualname=uvicorn.access
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standard
filters=redactToken
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=standard
filters=redactToken
args=('backend.log','a')

[handler_telegramHandler]
class=backend.utils.telegram_utils.TelegramLogHandler
level=WARNING
formatter=standard
filters=redactToken
args=()

[handler_jsonConsoleHandler]
class=StreamHandler
level=INFO
formatter=json
filters=redactToken
args=(sys.stdout,)

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_json]
class=backend.logging_setup.JSONFormatter
format=%(asctime)s %(levelname)s %(name)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%S
