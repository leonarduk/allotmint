paths:
  repo_root: .
  data_root: ../allotmint-data
  accounts_root: accounts
  prices_json: prices/latest_prices.json
  timeseries_cache_base: timeseries
  portfolio_xml_path: portfolio/investments.xml
  transactions_output_root: accounts
  log_config: backend/logging.ini
auth:
  google_auth_enabled: false
  disable_auth: true
  demo_identity: demo
  smoke_identity: demo
  local_login_email: ''
  allowed_emails: your-email@example.com
server:
  app_env: local
  uvicorn_host: 0.0.0.0
  uvicorn_port: 6468
  reload: true
  rate_limit_per_minute: 6000
  signup_rate_limit: 5/minute
  sns_topic_arn: ''
  telegram_bot_token: ''
  telegram_chat_id: ''
  cors:
    local:
    - http://localhost:3000
    - http://localhost:2568
    production:
    - https://app.allotmint.io
market_data:
  offline_mode: false
  fx_proxy_url: ''
  alpha_vantage_enabled: false
  alpha_vantage_key: ''
  fundamentals_cache_ttl_seconds: 86400
  stooq_timeout: 10
  stooq_requests_per_minute: 60
  # Daily news request budgets, each spent only when that provider is actually
  # called. news_requests_per_day is AlphaVantage's (its free tier allows 25).
  news_requests_per_day: 25
  default_sector_region: US
  yahoo_news_endpoint: https://query1.finance.yahoo.com/v1/finance/search
  yahoo_news_key: ''
  yahoo_news_requests_per_day: 500
  google_news_endpoint: https://news.google.com/rss/search
  google_news_key: ''
  google_news_requests_per_day: 500
  ft_url_template: https://markets.ft.com/data/funds/tearsheet/historical?s={ticker}
  selenium_user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36
  selenium_headless: true
trading:
  max_trades_per_month: 20
  hold_days_min: 30
  risk_free_rate: 0.01
  report_benchmark: VWRL.L
  skip_snapshot_warm: false
  snapshot_warm_days: 30
  approval_valid_days: 2
  approval_exempt_types: ETF
  approval_exempt_tickers: ''
  trading_agent:
    rsi_buy: 30
    rsi_sell: 70
    ma_short_window: 20
    ma_long_window: 50
    min_sharpe: null
    max_volatility: null
ui:
  enable_family_mvp: false
  enable_compliance_workflows: false
  enable_advanced_analytics: false
  enable_reporting_extended: false
  enable_data_quality_admin: true
  relative_view_enabled: false
  theme: system
  tabs:
    movers: true
    group: true
    market: true
    instrument: true
    owner: true
    performance: true
    transactions: true
    dividends: true
    riskreturn: true
    screener: true
    trading: true
    timeseries: true
    watchlist: true
    allocation: true
    rebalance: true
    instrumentadmin: true
    dataadmin: true
    dataexplorer: true
    virtual: true
    support: true
    settings: true
    profile: true
    pension: true
    reports: false
    scenario: true
    alertsettings: true
    taxtools: false
    trail: false
    trade-compliance: false
    logs: true
base_currency: GBP
trading_agent:
  rsi_buy: 30
  rsi_sell: 70
  rsi_window: 14
  ma_short_window: 20
  ma_long_window: 50
  pe_max: null
  de_max: null
  min_sharpe: null
  max_volatility: null
cors_origins: http://localhost:3000,http://localhost:2568
mcp_github_repo: leonarduk/allotmint
