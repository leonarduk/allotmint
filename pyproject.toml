[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# Not a distributable package: `pip install -e ".[pro]"` / ".[test]" only
# pulls in the extras below (CI installs requirements*.txt instead), and
# tests import from the repo root via pytest.ini's `pythonpath = .`. A name
# and version are still required for the [project] table to be valid at all.
# The version is derived from the latest `v*` release tag by setuptools-scm
# (see [tool.setuptools_scm]) so it never drifts from GitHub releases.
[project]
name = "allotmint"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "reportlab>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "pytest-asyncio~=1.4.0",
]
# Private paid engine: screener, VaR/risk, compliance rule engine, allowances,
# anomaly repair. The SSH URL intentionally requires a GitHub SSH key with
# read access; see docs/CONTRIBUTOR_RUNBOOK.md#installing-the-private-pro-extra.
# Without this extra installed, the corresponding routes return 402 (see
# backend/common/core_optional.py).
pro = [
    "allotmint-pro @ git+ssh://git@github.com/leonarduk/allotmint-pro.git",
]

[tool.setuptools]
# Flat layout with many top-level dirs (backend, cdk, scripts, ...): opt out
# of auto-discovery rather than install any of them as packages.
packages = []

# Release tags (v0.51.0, ...) are the single source of truth for the version;
# nothing is committed back to main on release. Builds without git metadata
# (e.g. Docker contexts, which exclude .git/) fall back to 0.0.0 instead of
# failing; a git checkout with no reachable tag reports 0.1.devN.
[tool.setuptools_scm]
fallback_version = "0.0.0"

# For issue-worm's verifier (leonarduk/issue-worm#565): the full check suite -
# backend pytest, frontend lint/type-check/unit tests and the bats suite -
# takes ~10 minutes on a laptop, over its 600s default, so give it room.
[tool.issue-worm]
verifier-timeout = 1500

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
