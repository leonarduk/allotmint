name: Graphify Knowledge Graph

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  HAS_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  graphify:
    name: Build knowledge graph
    runs-on: ubuntu-latest
    continue-on-error: true  # Must never fail the workflow run itself
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OpenAI
        run: pip install openai~=2.48.0

      - name: Install Graphify
        run: pip install graphifyy==0.9.32

      - name: Build knowledge graph
        run: graphify .

      - name: Semantic extraction (DeepSeek)
        if: env.HAS_DEEPSEEK_API_KEY == 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: graphify extract . --backend deepseek

      - name: Upload graphify output (run artifact)
        uses: actions/upload-artifact@v7
        with:
          name: graphify-${{ github.run_id }}
          path: graphify-out/
          retention-days: 90

      # main is protected (PR required), so the generated graph can't be
      # pushed directly. Open a PR instead; a human merges it like any other
      # change. Skips cleanly if a run produces no diff against main.
      - name: Open PR with graphify output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="graphify-out"
          BRANCH="graphify-update-${{ github.run_id }}"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "No $OUTPUT_DIR directory found, skipping PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "No changes to persist, skipping PR."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -m "Update graphify knowledge graph"
          git push origin "$BRANCH"

          BODY="Ad-hoc knowledge graph refresh from workflow run ${{ github.run_id }}. Generated by \`graphify .\`"
          if [ "$HAS_DEEPSEEK_API_KEY" = 'true' ]; then
            BODY="$BODY and semantic extraction (\`graphify extract . --backend deepseek\`)."
          else
            BODY="$BODY."
          fi

          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update graphify knowledge graph" \
            --body "$BODY"; then
            echo "PR creation failed, deleting orphaned branch $BRANCH."
            git push origin --delete "$BRANCH" || true
            exit 1
          fi
