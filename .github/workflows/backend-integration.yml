name: Backend Integration Tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
    
permissions:
  contents: read
  id-token: write
  
jobs:
  # Shared with ci.yml, frontend-tests.yml and iac-validation.yml. This job was
  # previously a verbatim copy of ci.yml's classify-change because workflow
  # files can't share job outputs across files -- a reusable workflow is
  # exactly the mechanism that fixes that.
  classify-change:
    uses: ./.github/workflows/_classify-change.yml

  integration-tests:
    needs: classify-change
    # !cancelled() (not the implicit default success()) so a classify-change
    # failure still runs the suite instead of silently skipping it, and
    # `!= 'false'` (not `== 'true'`) so empty outputs from a failed classifier
    # err towards running. See scripts/classify_change.py.
    if: "!cancelled() && needs.classify-change.outputs.backend != 'false'"
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DATA_BUCKET: ${{ secrets.DATA_BUCKET }}
      # 'true' only when every backend-affecting path is confined to
      # tests/scripts/**. Those tests have no import relationship to backend/,
      # so the narrow suite gives equivalent coverage without paying for the
      # full ~3500-test backend suite. `== 'true'` (not `!= 'false'`) is the
      # correct polarity here: a missing/empty classifier output must run the
      # FULL suite, not skip it, matching the job-level fail-safe above.
      BACKEND_DEV_TOOLS_ONLY: ${{ needs.classify-change.outputs.backend-dev-tools-only == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check SPA contract version sync
        working-directory: .
        run: python scripts/check_contract_version_sync.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 10 -r requirements.txt
          pip install --retries 10 -r requirements-dev.txt

      # Optional: sync real S3 fixture data when credentials are available.
      # Skipped on forks and any env where the OIDC role / DATA_BUCKET secret
      # is absent. The pytest suite does not require this to pass - all AWS
      # interactions in tests/*_aws.py are covered by monkeypatched boto3 stubs.
      - name: Configure AWS credentials (optional)
        id: aws-auth
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync data from S3 (optional)
        if: ${{ steps.aws-auth.outcome == 'success' && env.DATA_BUCKET != '' }}
        run: |
          pip install awscli
          aws s3 sync "s3://$DATA_BUCKET/" data/

      - name: Type-check backend
        # Skipped when the change is confined to tests/scripts/** (see
        # BACKEND_DEV_TOOLS_ONLY above): those paths
        # can't affect backend/, so a fresh mypy run over backend/ can't
        # produce a different result than the last run that touched it.
        if: env.BACKEND_DEV_TOOLS_ONLY != 'true'
        # --explicit-package-bases is required because of the root-level __init__.py
        # (added in #4840 so `backend.contracts_spa` imports resolve from the repo
        # root). Without it, mypy walks up from that __init__.py to infer a module
        # name from the checkout directory itself, which fails whenever that
        # directory name isn't a valid Python identifier (e.g. a worktree path
        # like allotmint-issue-4842 or any path containing a hyphen) with
        # "contains __init__.py but is not a valid Python package name".
        run: |
          test -f mypy.ini
          python -m mypy --version
          python -m mypy backend --config-file mypy.ini --show-error-codes --pretty --explicit-package-bases
      - name: Run provider parity tests
        if: env.BACKEND_DEV_TOOLS_ONLY != 'true'
        env:
          ALLOTMINT_SKIP_SNAPSHOT_WARM: 'true'
        run: |
          pytest --no-cov tests/backend/common/test_data_provider_parity.py -q

      - name: Run tests
        if: env.BACKEND_DEV_TOOLS_ONLY != 'true'
        env:
          ALLOTMINT_SKIP_SNAPSHOT_WARM: 'true'
          # No Ollama server runs in CI. Pointing at an unreachable endpoint
          # (rather than leaving it unset, which would default to
          # localhost:11434) makes that explicit and catches any test that
          # accidentally assumes a live Ollama server is reachable (#5816).
          OLLAMA_ENDPOINT: 'http://127.0.0.1:1'
        run: |
          python -m coverage erase
          pytest tests --ignore=tests/live --ignore=tests/test_review_common.py --ignore=tests/test_ai_review_scripts.py --ignore=tests/scripts/test_n_review_issue.py --cov=backend --cov-report=xml --cov-report=term --cov-fail-under=80 -q
          pytest tests/test_backend_api.py::test_health tests/test_accounts_api.py --cov=backend --cov-append --cov-report=xml --cov-report=term --cov-fail-under=80 -q

      # Narrow suite for a tests/scripts/**-only change: equivalent
      # coverage without paying for the full backend suite or its 80%
      # backend/ coverage gate, which a script-test-only diff cannot move.
      - name: Run script test suite
        if: env.BACKEND_DEV_TOOLS_ONLY == 'true'
        env:
          ALLOTMINT_SKIP_SNAPSHOT_WARM: 'true'
          # See the OLLAMA_ENDPOINT comment on "Run tests" above (#5816) --
          # kept here too so any future tests/scripts addition that touches
          # an LLM helper can't accidentally depend on a live server.
          OLLAMA_ENDPOINT: 'http://127.0.0.1:1'
        # test_n_review_issue.py transitively imports cicaid_devtools (via
        # scripts/developer_tools/n_review_issue.py), which this job does not
        # install; excluded for the same reason as the "Run tests" step above.
        run: pytest tests/scripts --no-cov -q --ignore=tests/scripts/test_n_review_issue.py

      - name: Upload backend coverage reports to Codecov
        if: env.BACKEND_DEV_TOOLS_ONLY != 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        # fail_ci_if_error: false — Codecov v6 CLI has a GPG key verification
        # issue on GitHub-hosted runners; treat upload failures as non-fatal
        # so infrastructure problems don't block PR merges.
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: leonarduk/allotmint
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
